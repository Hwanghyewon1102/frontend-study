<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  
  /* .profile{
    text-align: center;
  } */
  .profile img {
    /* (참고) img는 인라인 요소이지만 인라인-블록처럼 동작 */
    border-radius: 50%;
    /* 2) 가로 길이를 갖는 블록 요소에 margin : 0 auto */
    display: block;
    margin: auto;
    /* 1) 부모에 text-align : div */
  }
  .title{
    text-align: center;
    font-size: 24px;
  }
  .content{
    text-align: center;
  }
  .box{
    width: 500px;
    height: 120px;
    background-color: blue;
    color: white;
    box-shadow: black;
    text-align: center;
    padding-top : 20px;
    font-size: 20px;
    display: block;
    margin: auto;
    border-radius: 5px;
    box-shadow: 5px 10px black;
  }
  </style>
  
</head>
<body>
  <!-- 주어진 구조 외에 추가 가능 -->
  <div class="profile"><img src="/05_CSS/images/img_avatar.png" alt="메인 사진" width="200px" height="200px"></div>

  <h3 class="title">Goni Kim</h3>

  <p class="content"><span style="color: red; font-weight: 700;"> Full Stack</span> Developer</p>

  <div class="box">안녕하세요. Goni Kim입니다.<br> 현재 웹 프론트엔드/백엔드 교강사로 활동중이며<br>취미는 배드민턴을 치는 것입니다.</div>

</body>
</html>
