<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

    /* 공통 스타일은 앞부분에 작성 */
    a{
      text-decoration: none;
      color: #000;
    }
    .navber {
    display: flex;
    }

    .navber li {
    list-style: none;
    width: 50px;
    height: 20px;
    padding: 10px;
    background-color: gray;
    margin-left: 10px;
    text-align: center;
    border-radius: 5px;
    }

    .container{
      height: 300px;
      width: 80%;
      max-width: 800px;
      margin: 0 auto;
    }

    .blog-list-item{
      align-items: flex-start;
      display: flex;
    }

    .content-header{
      display: flex;
      justify-content:flex-start;

    }
    .blog-content{
      width: 80%;
    }
    .content-header > img{
      border-radius: 50%;

    }
    .blog-name > h4, .blog-name > p{
      margin: 5px;
    }
  
  </style>
</head>
<body>
  <!-- Tip! 레이아웃 만드는 기본
    뭘 만들든 레이아웃은 항상 수평(행)으로 자른 후 박스부터 만들고 시작하면 됨
    그리고 이 박스들을 전부 <div>로 구현해 놓으면 됨(물론 시맨틱 태그도 최대한 활용)
    그리고 박스 안에 글 넣고 그림 넣고 하면 끝! 

    이 때 <div>는 블록 요소이기 때문에 위아래로 배치
    좌우로 나란히 배치하고 싶으면 float (X), inline-block(O), flexbox(권장) 
  -->
  <!-- 이모지 단축키 : 윈도우 + . -->

  <!-- navber -->
  <nav>
    <ul class="navber">
      <li><a href="#">영화</a></li>
      <li><a href="#">맛집</a></li>
      <li><a href="#">IT</a></li>
      <li><a href="#">컴퓨터</a></li>
    </ul>
  </nav>
  
  <!-- blog list  -->
   <div class="container">
    <!-- blog list item : 게시글 하나 -->
     <div class="blog-list-item">
      <div class="blog-content">
        <div class="content-header">
          <!-- 프로필 이미지 -->
           <img src="images/item1.png" alt="프로필" style="width: 50px; height: 50px">
          <!-- 작성자, 시간 -->
           <div class="blog-name">
           <h4>킴고니</h4>
           <p style="color: gray; font-size: 13px;">1시간 전</p>
          </div>
        </div>
        <div class="content-body">
          <!-- 글 제목, 글 내용 -->
           <h4>가성비 맛집을 발견했어요!</h4>
           <p>소고기 맛있어소고기 맛있어소고기 맛있어소고기 맛있어소고기 맛있어소고기 맛있어소고기 맛있어</p>
        </div>
      </div>
      <div class="blog-image">
        <!-- 샘플 이미지 -->
         <img src="images/product1.jpg" alt="블로그 사진" style="width: 150px; height: 250px; ">
      </div>
     </div>

   </div>
</body>
</html>
