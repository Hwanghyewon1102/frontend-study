<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .text-input{
      width: 120px;
      padding: 6px 10px;
      font-size: 20px;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: 0.5s;
    }
    /* Quiz : focus 됐을 때 테두리색 변경(#f00) */
    .text-input:focus{
      border: 2px solid #f00;
      /* border-color: #f00; */
    }





    *{
      box-sizing: border-box;
    }

    textarea{
      resize: none;
    }
    .form-background{
      height: 600px;
      background-color: black;
      padding: 5% 0;
      border-radius: 10px;
    }
    .form-container{
      margin: 40px auto;
      /* height: 80%; */
      width: 80%;
      max-width: 700px;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      
    }
    .First_Last_name {
      display: flex;
      gap: 10px; 
      margin-top: 20px;
    }

    .name-field {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .firstname,
    .listname,
    .yourEmail,
    textarea {
      width: 100%;
      padding: 10px 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: 2s;
    }

    .firstname:focus,
    .listname:focus,
    .yourEmail:focus,
    textarea:focus{
      outline: none;
      border-color: aqua;
  
    }

    .agree_chackbox{
      display: flex;
      justify-content: space-between;
    }
    .button{
      background-color: red;
      color: #fff;
      font-size: 18px;
      padding: 3px 30px;
      border-radius: 5px;
      border: none;
      transition: 1s;
    }
    .button:hover{
      background-color: yellowgreen;
     
      padding: 10px 40px;
      cursor: pointer;
    }

    #agree:hover{
      cursor: pointer;
      width: 20px;
      height: 20px;
      vertical-align: middle;
      
    }
  </style>
</head>
<body>
  <h2>연습</h2>
  <form>
    <input type="text">
    <input type="text" class="text-input">
    <button type="submit">전송</button>
    <!-- <form> 태그 안에서 버튼의 타입을 안써주면 submit으로 동작함
      type은 명시적으로 써주는 것을 권장 -->
    <!-- input 태그 쓸 때 label 태그도 같이 사용(권장) -->
    <p>
      <label for="name">너의 이름은</label>
    </p>
    <input type="text" id="name" class="text-input" aria-label="너의 이름은">
  </form>

  <h2>실전</h2>
  <!-- 박스부터 그리기 -->
  <div class="form-background">
    <div class="form-container">
      <form>
        <h3>Contact Us</h3>
        <p>
        <label for="email">Your Email</label>
        </p>
        <input type="email" id="email" class="yourEmail" placeholder="email@example.com">
        
        <div class="First_Last_name">
          <div class="name-field">
            <label for="first">First Name</label>
            <input type="text" id="first" class="firstname">
          </div>
          <div class="name-field">
            <label for="list">Last Name</label>
            <input type="text" id="list" class="listname">
          </div>
        </div>


        <p>
          <label for="message">Message</label>
        </p>
        <textarea name="message" id="message"></textarea>
        <!-- label, input, textarea -->

        <div class="agree_chackbox">
          <div class="agree">
            <input type="checkbox" name="agree" id="agree">
            <label for="agree">Agree</label>
          </div>
          
          <div class="send">
            <button type="submit" class="button">SEND</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
