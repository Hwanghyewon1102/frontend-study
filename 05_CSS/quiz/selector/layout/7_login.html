<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      box-sizing: border-box;
      margin: 0;
    }

    .login-background {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container{
      width: 60%;
      max-width: 800px;
      border: 1px solid gray;
      padding-top: 20px;
      border-radius: 6px;
    }

    .id-box{
      width: 80%;
      display: flex;
      flex-direction: column;
      border: 1px solid gray;
      border-bottom: none;
      margin-left: 10%;
      padding: 10px;
      border-radius: 6px 6px 0 0;
    }
    .pw-box{
      width: 80%;
      display: flex;
      flex-direction: column;
      border: 1px solid gray;
      margin-left: 10%;
      padding: 10px;
      border-radius: 0px 0px 6px 6px;
    }

    div > input{
      border: none;
      outline: none;
    }
    
    .id{
      color: gray;
      font-size: 16px;
      padding: 5px;
      transition: 0.2s; 
    }

    
    .inputid:focus  .id {
      font-size: 10px;
      color: green;
    }
    .inputid:focus .inputid{
      padding: 5px;
    }




    .pw{
      color: gray;
      padding: 5px;
    }
    .main-btn{
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
      margin-bottom: 20px;
    }
    .btn1, .btn2{
      width: 80%;
      height: 20%;
      padding: 10px;
      border: 2px solid green;
      border-radius: 6px;
      outline: none;
      cursor: pointer;      
    }

    .btn1{
      background-color: green;
      font-size: 20px;
      font-weight: 900px;
    }

    .btn1:hover{
      background-color: rgb(0, 80, 0);
    }

    .btn1:active{
      background-color: rgb(0, 59, 0);
    }

    .btn2{
      background-color: rgb(255, 255, 255);
      font-size: 20px;
      font-weight: 700px;
      color: green;
    }
    .btn2:hover{
      background-color: rgb(245, 245, 245);
    }
    .btn2:active{
      background-color: rgb(196, 196, 196);
    }


    .btn1 + .btn2 {
      margin-top: 5px;
    }


  </style>
</head>
<body>
  <div class="login-background">
    <div class="login-container">
      <div class="id-box">
        <label for="id" class="id">아이디 또는 전화번호</label>
        <input type="text" style="margin-left: 5px;" class="inputid">
      </div>
      <div class="pw-box">
        <label for="pw" class="pw">비밀번호</label>
        <input type="password" style="margin-left: 5px;">
      </div>
      <div class="main-btn">
      <button type="button" class="btn1" >로그인</button>
      <button type="button" class="btn2" >회원가입</button>
      </div>
    </div>
  </div>
</body>
</html>
