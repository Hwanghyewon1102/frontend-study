<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img {
      width: 150px; 
      height: 150px;
      border: 4px dotted green;
      border-radius: 40px;
    }
  </style>
</head>
<body>
  <img src="images/human.png" alt="징징이" id="image">

  <input type="range" id="sizevalue" min="0" max="75" step="5" value="40">
  <span id="radiusNum"></span>

  <script>
    const image = document.getElementById('image');
    const range = document.getElementById('sizevalue');
    const radiusNum = document.getElementById('radiusNum');

    
    function radiusAdd(round) {
      image.style.borderRadius = round + 'px';
      radiusNum.textContent = round;
    }


    radiusAdd(range.value + 'px');

    
    range.addEventListener('input', function () {
      radiusAdd(this.value);
    });
  </script>
</body>
</html>
