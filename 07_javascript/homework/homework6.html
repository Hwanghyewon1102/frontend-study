<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>스폰지밥, 뚱이, 징징이</h1>


  <label for="Character"></label>
  <select id="Character">
    <option value="sponge" class="c">스폰지밥</option>
    <option value="dung" class="c">뚱이</option>
    <option value="human" class="c">징징이</option>
  </select>

  <img src="images/sponge.png" alt="스폰지밥" style="width: 200px; height: 200px; border: 2px solid greenyellow; border-radius: 50%;" class="image">

  <script>
    const img = document.querySelector('.image');
    const select = document.querySelector('#Character')
    console.log(img);
    
    
    
    
      select.addEventListener('change', function(){
        if(select.value === 'sponge'){
        img.src = 'images/sponge.png';
        }else if(select.value === 'dung'){
          img.src = 'images/dung.png';
        }else if(select.value === 'human'){
          img.src = 'images/human.png';
        }
      })
      


    
    
  </script>
</body>
</html>
